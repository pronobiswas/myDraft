<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lottie + GSAP ScrollTrigger</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>
  <style>
    body { margin:0; }
    #lottie-container { width:300px; height:300px; margin:0 auto; }
  </style>
</head>
<body>
  <div style="height:100vh; background:#000;"></div>
  <div id="lottie-container"></div>
  <div style="height:100vh; background:#000;"></div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    // Load Lottie animation
    let anim = lottie.loadAnimation({
      container: document.getElementById('lottie-container'),
      renderer: 'svg',
      loop: false,
      autoplay: false,
      path: 'BouncingMouse.json'
    });

    anim.addEventListener('DOMLoaded', () => {
      gsap.to({frame:0}, {
        frame: anim.totalFrames - 1,
        ease: "none",
        scrollTrigger: {
          trigger: "#lottie-container",
          pin: true,
          scrub: true,
          markers: true,
          start: "top top",
          end: "bottom bottom"
        },
        onUpdate: function() {
          anim.goToAndStop(Math.round(this.targets()[0].frame), true);
        }
      });

      // Optional: move the container itself
      gsap.to("#lottie-container", {
        x: 500,
        scrollTrigger: {
          trigger: "#lottie-container",
          scrub: true
        }
      });
    });
  </script>
</body>
</html>
