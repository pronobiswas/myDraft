<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Three.js + GSAP Scroll Text</title>

    <!-- THREE.JS IMPORT MAP -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"
        }
    }
    </script>

    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>

    <!-- GSAP SCROLLTRIGGER -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: auto;
        }

        body {
            background: #111;
            overflow-x: hidden;
            color: white;
        }


        /* =========================
           THREE CANVAS
        ========================= */

        canvas {
            position: fixed;
            inset: 0;

            width: 100%;
            height: 100%;

            display: block;

            pointer-events: none;

            z-index: 1;
        }


        /* =========================
           PAGE CONTENT
        ========================= */

        .content {
            position: relative;
            z-index: 2;
        }


        .section {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;
            font-size: 4vw;
            font-weight: 700;

            pointer-events: none;
        }

        .section:nth-child(2) {
            justify-content: flex-start;
            padding-left: 10%;
        }

        .section:nth-child(3) {
            justify-content: flex-end;
            padding-right: 10%;
        }
    </style>

</head>


<body>


    <!-- =========================
         SCROLL CONTENT
    ========================== -->

    <main class="content">

        <section class="section section-1">
            SCROLL DOWN
        </section>

        <section class="section section-2">
            ROTATE
        </section>

        <section class="section section-3">
            EXPLORE
        </section>

        <section class="section section-4">
            END
        </section>

    </main>



    <script type="module">

        // =========================
        // THREE IMPORTS
        // =========================

        import * as THREE from "three";

        import { FontLoader }
            from "three/addons/loaders/FontLoader.js";

        import { TextGeometry }
            from "three/addons/geometries/TextGeometry.js";


        // =========================
        // GSAP
        // =========================

        gsap.registerPlugin(ScrollTrigger);


        // =========================
        // SCENE
        // =========================

        const scene = new THREE.Scene();


        // =========================
        // CAMERA
        // =========================

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const helper = new THREE.CameraHelper(camera);
        camera.position.z = 20;


        // =========================
        // RENDERER
        // =========================

        const renderer = new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(
            Math.min(window.devicePixelRatio, 2)
        );

        document.body.appendChild(
            renderer.domElement
        );


        // =========================
        // LIGHTS
        // =========================

        const ambientLight = new THREE.AmbientLight( 0xffffff, 2);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff,4);
        directionalLight.position.set(
            5,
            5,
            8
        );

        scene.add(directionalLight);


        // =========================
        // TEXT
        // =========================

        const fontLoader =
            new FontLoader();


        let textMesh;


        fontLoader.load(
            "https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",

            (font) => {
                console.log(font);
                

                const geometry =
                    new TextGeometry(
                        "Pronob Biswas",
                        {
                            font: font,
                            size: 3,
                            depth: 0.6,

                            curveSegments: 12,

                            bevelEnabled: true,
                            bevelThickness: 0.12,
                            bevelSize: 0.06,
                            bevelSegments: 5
                        }
                    );

                    console.log(geometry);
                    
                // CENTER TEXT

                geometry.computeBoundingBox();

                const box = geometry.boundingBox;
                geometry.translate(
                    -(box.max.x + box.min.x) / 2,
                    -(box.max.y + box.min.y) / 2,
                    0
                );


                // MATERIAL

                const material =
                    new THREE.MeshStandardMaterial({
                        color: 0xffffff,
                        metalness: 0.7,
                        roughness: 0.2
                    });


                // CREATE TEXT

                textMesh =
                    new THREE.Mesh(
                        geometry,
                        material
                    );


                scene.add(textMesh);
                console.log(textMesh)
                // =================================
                // GSAP SCROLL ANIMATION 1
                // =================================

                gsap.to(
                    textMesh.rotation,
                    {
                        y: Math.PI * 2,

                        scrollTrigger: {
                            trigger: ".section-1",

                            start: "top top",
                            end: "bottom top",
                            scrub: 1,
                            markers:true,
                        }
                    }
                );


                // =================================
                // GSAP SCROLL ANIMATION 2
                // =================================

                gsap.to(
                    textMesh.scale,
                    {
                        x: -3,

                        scrollTrigger: {
                            trigger: ".section-2",

                            start: "top bottom",
                            end: "bottom top",
                            scrub: 1,
                            markers:true,
                        }
                    }
                );


                // =================================
                // GSAP SCROLL ANIMATION 3
                // =================================

                gsap.to(
                    textMesh.position,
                    {
                        x: Math.PI * 0.5,

                        scrollTrigger: {
                            trigger: ".section-3",

                            start: "top bottom",
                            end: "bottom top",

                            scrub: 1
                        }
                    }
                );


                // =================================
                // GSAP SCROLL ANIMATION 4
                // =================================

                gsap.to(
                    textMesh.position,
                    {
                        z: 3,

                        scrollTrigger: {
                            trigger: ".section-4",

                            start: "top bottom",
                            end: "bottom top",

                            scrub: 1
                        }
                    }
                );


                // Refresh ScrollTrigger
                ScrollTrigger.refresh();

            }
        );


        // =========================
        // RENDER LOOP
        // =========================

        function animate() {

            requestAnimationFrame(
                animate
            );


            renderer.render(
                scene,
                camera
            );
        }


        animate();


        // =========================
        // RESPONSIVE
        // =========================

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth /
                    window.innerHeight;


                camera.updateProjectionMatrix();


                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );


                renderer.setPixelRatio(
                    Math.min(
                        window.devicePixelRatio,
                        2
                    )
                );


                ScrollTrigger.refresh();

            }
        );

    </script>


</body>

</html>
