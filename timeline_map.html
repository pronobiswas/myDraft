<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
    <style>
        #main,
        #main *,
        #main::after,
        #main::before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            background-color: antiquewhite;
            position: relative;
        }

        .wrapper img {
            width: 25vh;
        }

        .map_row {
            width: 100%;
        }

        .map_row:first-child {
            text-align: center;
        }

        .map_row:first-child img {
            width: clamp(120px, 50%, 25rem);
            vertical-align: middle;
        }

        .map_row:nth-child(2) {
            text-align: center;
        }

        .map_row:nth-child(3) {
            text-align: right;
        }

        .svgWrapper {
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.459);
        }

        #timelineMap{
            border: 2px solid red;
        }
        svg image{
            outline: 2px solid blue;
            border: 2px solid blue;
        }
    </style>
</head>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const path = document.querySelector("#timelinePath");
            const pathLength = path.getTotalLength();

            // Set initial stroke dash properties
            gsap.set(path, {
                strokeDasharray: pathLength,
                strokeDashoffset: pathLength
            });

            // Create timeline with ScrollTrigger
            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "#timelineMap",
                    start: "top top",
                    end: "+=800",
                    scrub: true,
                    pin: true,
                    markers: true
                }
            });

            tl.to(path, {
                strokeDashoffset: 0,
                duration: 3,
                ease: "none"
            });
            tl.from("#images image", {
                opacity: 0,
                scale: 0.8,
                stagger: 0.5,
                duration: 1.5,
                ease: "back.out(1.7)"
            }, "+0.9");
        });


    </script>
