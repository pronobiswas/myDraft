<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main,
        #main *,
        #main::after,
        #main::before {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #main .wrapper {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            height: 100vh;
            background-color: rgb(252, 252, 252);
            position: relative;
        }

        .wrapper img {
            width: 25vh;
        }

        .map_row {
            width: 100%;
        }

        .map_row:first-child {
            text-align: center;
        }

        .map_row:first-child img {
            width: clamp(120px, 50%, 25rem);
            vertical-align: middle;
        }

        .map_row:nth-child(2) {
            text-align: center;
        }

        .map_row:nth-child(3) {
            text-align: right;
        }

        .svgWrapper {
            width: 100%;
            height: 100%;
            background-color: rgba(250, 250, 250, 0.459);
        }

        #timelineMap {
            border: 2px solid red;
        }

        /* svg image {
            outline: 2px solid blue;
        } */

        text {
            font-size: clamp(1rem, 4vw, 1.4rem);
        }

        .years {
            font-size: clamp(1.2rem, 5vw, 2rem);
        }

        @media screen and (max-width: 576px) {
            text {
                font-size: clamp(2rem, 4vw, 3rem);
            }

            .years {
                font-size: clamp(2rem, 6vw, 3rem);
            }
        }
    </style>
</head>

<body>

        <div class="wrapper">
            <div class="svgWrapper">

                        <!-- 2000 -->
                        <g class="year-label" transform="translate(1350,400)">

                                stroke-width="2" />
                            <text class="years" x="100" y="85" dominant-baseline="middle" text-anchor="middle"
                                font-size="1em" font-family="Arial" fill="black">The Growth</text>
                            <text x="258" y="135" dominant-baseline="middle" text-anchor="middle" font-size="1em"
                                font-family="Arial" fill="black">1980s - First Construction Projects</text>

                        <!-- The Beginning -->
                        <g class="year-label" transform="translate(700,850)">
                            <text class="years" x="0" y="85" dominant-baseline="middle" text-anchor="middle"

                </svg>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const path = document.querySelector("#timelinePath");
            const pathLength = path.getTotalLength();

            gsap.set(path, {
                strokeDasharray: pathLength,
                strokeDashoffset: pathLength
            });

            gsap.set("#labels .year-label", { opacity: 0 });

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "#timelineMap",
                    start: "top top",
                    end: "+=800",
                    scrub: true,
                    pin: true,
                    markers: true
                }
            });

            tl.to(path, {
                strokeDashoffset: 0,
                duration: 3,
                ease: "none"
            });
            tl.to("#labels .year-label", {
                opacity: 1,
                stagger: 0.5,
                duration: 0.5,
                ease: "power2.out"
            }, "-=2");
            tl.from("#images image", {
                opacity: 0,
                scale: 0.8,
                stagger: 0.5,
                duration: 1.5,
                ease: "back.out(1.7)"
            }, "+0.9");
        });


    </script>
</body>

</html>
