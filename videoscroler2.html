<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- <link rel="stylesheet" href="./assets/style/style.css"> -->
    <style>
        #videoIntroductionSection2 {
  width: 100%;
  height: 100vh;
  position: relative;
}
#videoIntroductionSection2 #videoAnimationWrapper2 {
  background-color: #F2F0EE;
  width: 100%;
  height: 100%;
}
#videoIntroductionSection2 #videoAnimationWrapper2 .videoContainerX {
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
#videoIntroductionSection2 #videoAnimationWrapper2 .videoContainerX video {
  width: -moz-fit-content;
  width: fit-content;
  height: -moz-fit-content;
  height: fit-content;
  -o-object-fit: contain;
     object-fit: contain;
  border: 2px solid #F2F0EE;
  box-shadow: inset 0 0 0 5px #F2F0EE;
}
    </style>
</head>

<body>
    <section id="videoIntroductionSection2">
        <!-- ----videos---- -->
        <div id="videoAnimationWrapper2">

            <div class="videoContainer1 videoContainerX">
                <video src="/assets/videos/scrolllvideo1.mp4" muted></video>
            </div>
            <div class="videoContainer2 videoContainerX">
                <video src="/assets/videos/scrollvideo1Benifit1.mp4" muted></video>
            </div>
            <div class="videoContainer3 videoContainerX">
                <video src="/assets/videos/scrollvideo1Benifit2.mp4" muted></video>
            </div>
            <div class="videoContainer4 videoContainerX">
                <video src="/assets/videos/scrollvideo1Benifit3.mp4" muted></video>
            </div>
            <div class="videoContainer5 videoContainerX">
                <video src="/assets/videos/scrollvideo1Benifit4.mp4" muted></video>
            </div>
            <div class="videoContainer6 videoContainerX">
                <video src="/assets/videos/scrollvideo1Design1.mp4" muted></video>
            </div>
        </div>
        <div style="width: 100%; height: 5000px; border: 2px dotted red;"></div>
        <!-- ----videos---- -->
    </section>


    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <!-- <script src="/assets/script/script.js"></script> -->
    <script>
        (function () {
  if (!window.gsap || !window.ScrollTrigger) return;

  gsap.registerPlugin(ScrollTrigger);

  const wrapper = document.getElementById("videoAnimationWrapper2");

  const sections = [
    {
      container: document.querySelector(".videoContainer1"),
      video: document.querySelector(".videoContainer1 video"),
    },
    {
      container: document.querySelector(".videoContainer2"),
      video: document.querySelector(".videoContainer2 video"),
    },
    {
      container: document.querySelector(".videoContainer3"),
      video: document.querySelector(".videoContainer3 video"),
    },
    {
      container: document.querySelector(".videoContainer4"),
      video: document.querySelector(".videoContainer4 video"),
    },
    {
      container: document.querySelector(".videoContainer5"),
      video: document.querySelector(".videoContainer5 video"),
    },
    {
      container: document.querySelector(".videoContainer6"),
      video: document.querySelector(".videoContainer6 video"),
    },
  ];


  Promise.all(
    sections.map(
      (s) =>
        new Promise((resolve) => {
          if (s.video.readyState >= 1) resolve();
          else s.video.addEventListener("loadedmetadata", resolve, { once: true });
        })
    )
  ).then(() => {

    sections.forEach((s) => {
      s.video.pause();
      s.video.muted = true;
      s.video.playsInline = true;
      s.video.currentTime = 0;

      gsap.set(s.container, {
        position: "absolute",
        top: 0,
        left: 0,
        width: "100%",
        height: "100%",
        opacity: 0,
        zIndex: 0,
      });
    });


    const tl = gsap.timeline({
      scrollTrigger: {
        trigger: wrapper,
        start: "top top",
        end: "+=4800",
        scrub: true,
        pin: true,
        markers: true,
      },
    });

    sections.forEach((s, i) => {
      const scrub = { t: 0 }; 
      tl.to(s.container, { opacity: 1, zIndex: 1, duration: 0.3 }, i);
      if (i > 0) {
        tl.to(sections[i - 1].container, { opacity: 0, zIndex: 0, duration: 0.3 }, i);
      }


      tl.to(
        scrub,
        {
          t: s.video.duration,
          duration: 1,
          ease: "none",
          onUpdate: () => {
            s.video.currentTime = scrub.t;


            if (i === sections.length - 1) {
              const moveX = (scrub.t / s.video.duration) * 500;
              s.container.style.transform = `translateX(${moveX}px)`;
            } else {
              s.container.style.transform = `translateX(0px)`;
            }
          },
        },
        i
      );
    });
  });
})();
    </script>


</body>

</html>
