<style>
    #process_step {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: space-between;
    }

    #process_step .process_aside {
        width: 50%;
    }

    img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    #process_step .process_aside svg {
        width: 100%;
        height: 100%;
    }

    #process_step .process_aside svg #ball1 {
        fill: #730f0a59;
    }

    .process_aside_image {
        position: relative;
    }

    @media (max-width: 768px) {
        #process_step {
            flex-direction: column;
            align-items: stretch;
        }

        #process_step .process_aside {
            width: 100%;
        }

        #process_step .process_aside svg {
            width: 100%;
            height: auto;
        }

        #process_step .process_aside img {
            width: 100%;
            height: auto;
        }
    }

    .process_aside_image .handsPic {
        width: 37%;
        height: auto;
        position: absolute;
        top: 53%;
        right: 47%;
        transform: translate(50%, -50%);
        clip-path: inset(0 100% 0 0);
        /* animation: reveal 3s ease forwards; */
    }

    @keyframes reveal {
        from {
            clip-path: inset(0 100% 0 0);
        }

        to {
            clip-path: inset(0 0 0 0);
        }
    }
</style>
