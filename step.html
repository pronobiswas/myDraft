    <script>


        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger, MotionPathPlugin);

            gsap.to("#ball1", {
                scrollTrigger: {
                    trigger: "#processStep",
                    start: "top 0%",
                    end: "+=1000",

                    scrub: true

                    path: "#ballPath",
                    align: "#ballPath",
                    alignOrigin: [0.5, 0.5]
                }
            });

        });
