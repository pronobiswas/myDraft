    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/MotionPathPlugin.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.registerPlugin(ScrollTrigger);

            const path = document.querySelector("#timelinePath");
            const maskPath = document.querySelector("#maskPath");
            const pathLength = maskPath.getTotalLength();

            // The visible path keeps its dash pattern (stroke-dasharray="12 8") fixed.
            // The maskPath is the thing we "draw" using the classic full-length
            // dasharray + dashoffset trick, and since it's used as a mask, it
            // progressively reveals the dashed line rather than shifting it.
            gsap.set(maskPath, {
                strokeDasharray: pathLength,
                strokeDashoffset: pathLength,
            });

            gsap.set(".year-label", { opacity: 0 });

            const tl = gsap.timeline({
                scrollTrigger: {
                    trigger: "#timelineMap",
                    start: "top top",
                    end: "+=800",
                    scrub: true,
                    pin: true,
                }
            });

            tl.to(maskPath, {
                strokeDashoffset: 0,
                duration: 3,
                ease: "none"
            });
            tl.to(".year-label", {
                opacity: 1,
                stagger: 0.5,
                duration: 0.5,
                ease: "power2.out"
            }, "-=2");
            tl.from(".labelImage", {
                opacity: 0,
                scale: 0.8,
                stagger: 0.5,
                duration: 1.2,
                ease: "back.out(1.7)"
            }, "+1.5");
        });


    </script>
