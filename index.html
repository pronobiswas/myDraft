<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Three.js Plane Model</title>
  <style>
    *{ margin: 0;padding: 0; box-sizing: border-box; }
    body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
    }
    
  </style>
  <link rel="stylesheet" href="./assets/style/style.css" />
</head>
<body>
  <div id="root"></div>
  <!-- <div style="height:2000px;"></div> -->
  <canvas id="canvas1"></canvas>

  
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/ScrollTrigger.min.js"></script>

  
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";

    const root = document.getElementById("root");

    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x000020);

    
    const camera = new THREE.PerspectiveCamera(
      50, window.innerWidth / window.innerHeight, 0.1, 1000
    );
    camera.position.set(0, 2, 6);

    
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    root.appendChild(renderer.domElement);

    
    scene.add(new THREE.AmbientLight(0xffffff, 1.2));
    const directional = new THREE.DirectionalLight(0xffffff, 1);
    directional.position.set(5, 5, 5);
    scene.add(directional);

  
    const loader = new GLTFLoader();
    loader.load(
      "./assets/3D/model/model1.glb",
      (gltf) => {
        const planeModel = gltf.scene;
        scene.add(planeModel);

        const box = new THREE.Box3().setFromObject(planeModel);
        const size = box.getSize(new THREE.Vector3()).length();
        const center = box.getCenter(new THREE.Vector3());

        planeModel.position.sub(center); 
        planeModel.position.set(-200, -100, 0);
        planeModel.scale.setScalar(200 / size); 

        const distance = size / 2 / Math.tan((camera.fov * Math.PI) / 360);
        camera.position.set(0, 2, distance * 1.2);
        camera.lookAt(0, 0, 0);

        gsap.registerPlugin(ScrollTrigger);
        const tl = gsap.timeline({
          scrollTrigger: {
            trigger: root,
            start: "top top",
            end: "+=2000",
            pin:true,
            scrub: true
          }
        });

        tl.to(planeModel.position, { x: 200, y: 0, duration: 2, ease: "power1.inOut" })
          // .to(planeModel.position, { x: 250, y: 0, duration: 2, ease: "power1.inOut" })
          .to(planeModel.rotation, { z: Math.PI * 0.05, duration: 0.5, ease: "power1.inOut" },'0.5')
          .to(planeModel.rotation, { y: Math.PI * 0.5, duration: 0.5, ease: "none" },'-=0.5')
          .to(planeModel.position, { x:20, y: 100, duration: 1, ease: "none" })
          .to(planeModel.rotation, { y: Math.PI * 0.9, duration: 0.8, ease: "power1.inOut" },'-=0.5')
          .to(planeModel.rotation, { y: Math.PI * 0, duration: 0.8, ease: "power1.inOut" },'0.5')
          .to(planeModel.position, { x:-200, y: 20, duration: 2, ease: "power1.inOut" })
          .to(planeModel, { x: Math.PI * 5, duration: 0.8, ease: "power1.inOut" },'-=1')
          .to(planeModel.rotation, { x: Math.PI * 1, duration: 1.8, ease: "power1.inOut" },'-=1.5')
          .to(planeModel.position, { x:20, y: 70, duration: 2, ease: "power1.inOut" });
      },
      (xhr) => console.log((xhr.loaded / xhr.total * 100) + "% loaded"),
      (error) => console.error("An error happened", error)
    );

    function animate() {
      requestAnimationFrame(animate);
      renderer.render(scene, camera);
    }
    animate();


    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
  <script src="./assets/script/main.js"></script>
</body>
</html>
