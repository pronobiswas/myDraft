<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSAP Video Scroll</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            background: #000;
        }

        #videoScroller {
            width: 100%;
            height: 100vh;
            opacity: 0;
            visibility: hidden;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .loader {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-size: 20px;
            z-index: 9999;
        }

        .spacer {
            width: 100%;
            height: 200vh;
            background: #111;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
</head>

<body>

    <div class="loader">
        Loading video...
    </div>

    <section id="videoScroller">

        <div class="video-wrapper">

            <video
                id="video"
                muted
                playsinline
                preload="auto"
            >
                <source
                    src="https://akn18.mypreviewsite.online/wp-content/uploads/2026/07/13473839_960_540_25fps.mp4"
                    type="video/mp4"
                >
            </video>

        </div>

    </section>

    <section class="spacer"></section>

    <script>

        gsap.registerPlugin(ScrollTrigger);

        window.addEventListener("load", () => {

            const video = document.getElementById("video");
            const section = document.getElementById("videoScroller");
            const loader = document.querySelector(".loader");

            video.load();

            function initVideoScroll() {

                loader.style.display = "none";

                gsap.set(section, {
                    autoAlpha: 1
                });

                const scrub = {
                    time: 0
                };

                gsap.to(scrub, {

                    time: video.duration,

                    ease: "none",

                    onUpdate: () => {

                        if (
                            Math.abs(video.currentTime - scrub.time) > 0.03
                        ) {
                            video.currentTime = scrub.time;
                        }

                    },

                    scrollTrigger: {
                        trigger: section,
                        start: "top top",
                        end: "+=3000",
                        pin: true,
                        scrub: 0.5,
                        markers: true,
                        invalidateOnRefresh: true
                    }

                });

                ScrollTrigger.refresh();

            }

            // Wait until enough video data is loaded

            if (video.readyState >= 4) {

                initVideoScroll();

            } else {

                video.addEventListener(
                    "canplaythrough",
                    initVideoScroll,
                    { once: true }
                );

            }

            // Safari / iOS fix

            video.addEventListener(
                "loadeddata",
                () => {

                    const playPromise = video.play();

                    if (playPromise !== undefined) {

                        playPromise
                            .then(() => {

                                video.pause();
                                video.currentTime = 0;

                            })
                            .catch(() => { });

                    }

                },
                { once: true }
            );

        });

    </script>

</body>

</html>
