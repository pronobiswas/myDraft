<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #main {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .div {
            width: 100%;
            height: clamp(250px, 30vh, 300px);
            background-color: #dbdada;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        .overlay {
            width: 0%;
            height: 100%;
            background-color: #000000;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        h1 {
            --afterWidth: 0%;
            font-size: clamp(2rem, 2vw, 5rem);
            padding: 20px 0;
            border: 1px solid #000;
            text-align: left;
            margin: 0;
            width: 50%;
            z-index: 2;
            background-color: #dbdada;
            position: relative;
        }

        h1::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: var(--afterWidth);
            height: 100%;
            background-color: #dbdada;
            mix-blend-mode: difference;
            z-index: 3;
        }

        .line {
            width: clamp(50px, 30%, 200px);
            height: 2px;
            background-color: #000;
            margin: 20px 0;
        }

        #button {
            width: clamp(100px, 18vw, 160px);
            padding: 10px;
            background-color: #000;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            z-index: 9;
        }

        .icon_wrapper {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background-color: #fff;
            position: relative;
            overflow: hidden;
        }

        .icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
            color: #000;
        }

        .icon01 {
            top: 45%;
            font-size: 24px;
            opacity: 1;
            transition: all 0.3s ease-in-out;
        }

        .icon02 {
            font-size: 12px;
            opacity: 0;
            /* transition: all 0.01s ease-in-out; */
        }

        .text_wrapper {
            width: 110px;
            height: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: start;
            border: 1px solid #00d40b;
            overflow: hidden;
        }

        .btnText {
            text-align: left;
            border: 1px solid #fff;
            font-size: 16px;
            mix-blend-mode: difference;
            transition: transform 0.2s ease-in-out;
        }

        #button:hover .hover_text_1 {
            transform: translateY(-100%);
        }

        #button:hover .hover_text_2 {
            transform: translateY(-100%);
        }

        #button:hover .icon01 {
            transform: translate(100%, -150%);
        }

        /* #button:hover .icon02 {
            opacity: 1;
        } */


        /* .div:has(#button:hover) h1::after {
            width: 20%;
        } */


        /* &&&&&&&&&&&&&&&  darft $$$$$$$$$$$$$$$$$$$$ */


        /* &&&&&&&&&&&&&&&  darft $$$$$$$$$$$$$$$$$$$$ */
    </style>
</head>

<body>
    <main id="main">
        <section id="section">
            <div class="div">
                <h1>Lorem ipsum dolor sit amet consectetur adipisicing elit. Et veritatis natus ipsa.</h1>
                <div class="line"></div>
                <!-- button  -->
                <div id="button">
                    <div class="icon_wrapper">
                        <div class="icon icon01"><span>↗</span></div>
                        <div class="icon icon02"><span>●</span></div>
                    </div>
                    <div class="text_wrapper">
                        <div class="btnText hover_text_1"><em>lets go</em></div>
                        <div class="btnText hover_text_2"><em>press and hold</em></div>
                    </div>
                </div>
                <div class="overlay"></div>
            </div>
        </section>




    </main>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script>
        let startTime = 0;
        let holdTimer;
        let holdAnim = gsap.to(".overlay", {
            width: "100%",
            duration: 2,
            paused: true,
            ease: "linear"
        });

        const holdAnim2 = gsap.timeline({
            paused: true,
            defaults: {
                ease: "linear"
            }
        });
        holdAnim2
            .to(".overlay", {
                width: "100%",
                duration: 2
            }, 0)

            .to("h1", {
                "--afterWidth": "100%",
                duration: 1,
            }, 0)
            .to(".icon02", {
                opacity: 1,
                scale:10,
                duration: 2
            }, 0)

        const btn = document.getElementById("button");

        function completeTask() {
            alert("✅ Task Completed!");
        }
        function mouseEntered() {
            gsap.to(".overlay", {
                width: "10%",
                duration: 0.3,
                ease: "linear"
            });
            gsap.to("h1", {
                "--afterWidth": "20%",
                duration: 0.9,
                 ease: "linear"
            }, 0);
            gsap.to(".icon02", {
                opacity: 1,
                duration: 0.3,
                 ease: "linear"
            })
        }
        function mouseLeft() {
            gsap.to(".overlay", {
                width: "0%",
                duration: 0.3,
                ease: "linear"
            });
            gsap.to("h1", {
                "--afterWidth": "0%",
                duration: 1,
                 ease: "linear"
            }, 0);
            gsap.to(".icon02", {
                opacity: 0,
                duration: 0.3
            });
        }

        function startHold(e) {
            console.log("Mouse down", e.target);
            if (e.button !== 0) return;

            startTime = Date.now();
            holdAnim2.restart();

            holdTimer = setTimeout(() => {
                completeTask();
            }, 2000);
        }

        function endHold() {
            clearTimeout(holdTimer);
            holdAnim2.pause().progress(0);

            let duration = (Date.now() - startTime) / 1000;
            console.log(`Released after ${duration.toFixed(2)}s`);
        }
        btn.addEventListener("mousedown", (e) => startHold(e));
        btn.addEventListener("mouseenter", mouseEntered);
        btn.addEventListener("mouseleave", mouseLeft);
        btn.addEventListener("mouseup", endHold);
        btn.addEventListener("mouseleave", endHold);

    </script>

</body>

</html>
