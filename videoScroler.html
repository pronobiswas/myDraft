<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Scroller</title>
    <style>
        #videoScroller {
            width: 100%;
            height: 100vh;
        }

        .video-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #video {
            width: 70%;
            height: 100%;
            aspect-ratio: 16 / 9;
            object-fit: contain;
            /* keeps aspect ratio */
            display: block;
        }
    </style>
    
</head>

<body>

    <section id="videoScroller">
        <div class="wrapper video-wrapper">
            <video 
            id="video" 
            preload="auto" 
            muted
            playsinline
            >
                <source src="video1.mp4" type="video/mp4">
                Your browser does not support the video tag.
            </video>
        </div>
    </section>
    <section style="width: 100%; height: 1000px;"></section>

    <!-- GSAP + plugins -->
     <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>


    <script>
        // use a script tag or an external JS file
        document.addEventListener("DOMContentLoaded", (event) => {
            gsap.registerPlugin(ScrollTrigger)
            const video = document.getElementById("video");

            if (video) {
                video.addEventListener("loadedmetadata", () => {
                    // Use a proxy object for GSAP animation
                    let scrubObj = { currentTime: 0 };
                    gsap.to(scrubObj, {
                        currentTime: video.duration,
                        ease: "none",
                        scrollTrigger: {
                            trigger: "#videoScroller",
                            start: "top top",
                            end: "+=1000",
                            pin: true,
                            scrub: true,
                            markers: true
                        },
                        onUpdate: () => {
                            video.currentTime = scrubObj.currentTime;
                        }
                    });
                });
            }
        });

    </script>
